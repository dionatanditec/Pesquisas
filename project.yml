name: TopCam
options:
  bundleIdPrefix: com.dionatan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  TopCam:
    type: application
    platform: iOS
    sources:
      - path: TopCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dionatan.topcam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    info:
      path: TopCam/Info.plist
      properties:
        CFBundleDisplayName: TopCam
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "O TopCam usa a câmera para tirar fotos e gravar vídeos."
        NSMicrophoneUsageDescription: "O TopCam usa o microfone para gravar o áudio dos vídeos."
        NSPhotoLibraryAddUsageDescription: "O TopCam salva suas fotos e vídeos na galeria."
        NSPhotoLibraryUsageDescription: "O TopCam mostra a última foto tirada."
        NSLocationWhenInUseUsageDescription: "O TopCam salva o local da foto para a galeria organizar por lugar (pode desligar nos Ajustes do app)."
